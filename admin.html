
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel Administrativo | Vila Store</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101010;color:#f5f5f5;font:16px Arial,sans-serif}
main{max-width:850px;margin:auto;padding:20px}
h1,h2{color:#ff3434}
.card{background:#1b1b1b;padding:18px;border:1px solid #333;border-radius:12px;margin:16px 0}
input,textarea,select{width:100%;padding:12px;margin:7px 0 14px;background:#292929;color:white;border:1px solid #444;border-radius:7px;font-size:16px}
label{display:block}
button{padding:12px 16px;border:0;border-radius:7px;background:#e32636;color:white;font-weight:bold;cursor:pointer;margin:4px 3px 4px 0}
button.secondary{background:#444}
button.danger{background:#8f2020}
button:disabled{opacity:.6;cursor:wait}
.small{color:#bbb;font-size:13px}
.item{border-top:1px solid #444;padding:14px 0;overflow-wrap:anywhere}
.item h3{margin-bottom:6px}
.status{color:#ff7777}
.hidden{display:none!important}
#mensagem{white-space:pre-wrap;overflow-wrap:anywhere;padding:12px;border-radius:8px;background:#292020;color:#ffaaaa;margin:12px 0}
#mensagem:empty{display:none}
</style>
</head>
<body>
<main>
<h1>VILA STORE</h1>
<p class="small">Painel administrativo de anúncios</p>

<p id="mensagem" role="status" aria-live="polite"></p>

<section id="login" class="card">
<h2>Entrar</h2>
<form id="formLogin">
<label>E-mail
<input id="email" type="email" autocomplete="username" required>
</label>
<label>Senha
<input id="senha" type="password" autocomplete="current-password" required>
</label>
<button id="botaoLogin" type="submit">Entrar no painel</button>
</form>
</section>

<section id="painel" class="hidden">
<div class="card">
<button id="sair" class="secondary" type="button">Sair</button>
<button id="atualizar" class="secondary" type="button">Atualizar anúncios</button>
<h2 id="tituloForm">Cadastrar anúncio</h2>
<form id="formAnuncio">
<input id="id" type="hidden">
<label>Título da conta<input id="titulo" maxlength="120" required></label>
<label>Centro de Vila (CV)<input id="cv" maxlength="30" placeholder="Ex.: CV16" required></label>
<label>Descrição<textarea id="descricao" rows="4" maxlength="5000"></textarea></label>
<label>Preço (R$)<input id="preco" type="number" min="0" step="0.01" required></label>
<label>Nome do vendedor<input id="vendedor" maxlength="100" value="Vila Store" required></label>
<label>Link da imagem<input id="imagem_url" type="url" placeholder="https://..."></label>
<label>Status
<select id="status">
<option value="disponivel">Disponível</option>
<option value="reservado">Reservado</option>
<option value="vendido">Vendido</option>
</select>
</label>
<label><input id="publicado" type="checkbox" style="width:auto"> Publicar no site</label>
<button id="botaoSalvar" type="submit">Salvar anúncio</button>
<button id="cancelar" class="secondary" type="button">Limpar formulário</button>
</form>
</div>
<div class="card">
<h2>Anúncios cadastrados</h2>
<div id="lista">Carregando anúncios...</div>
</div>
</section>
</main>

<script>
"use strict";

const SUPABASE_URL = "https://aijmzyebtrogcpuxygyi.supabase.co";
const SUPABASE_PUBLIC_KEY = "sb_publishable_gmiq0mnUw8hyEKUAVRvvAw_ZYOCbO_m";

const $ = id => document.getElementById(id);
const mensagem = texto => {
  $("mensagem").textContent = texto || "";
};

if (!window.supabase) {
  mensagem("Erro: o sistema de acesso não carregou. Verifique sua conexão e atualize a página.");
  throw new Error("Biblioteca Supabase não carregada.");
}

if (!SUPABASE_PUBLIC_KEY ||
    SUPABASE_PUBLIC_KEY === "COLE_AQUI_SUA_CHAVE_PUBLICA_ATUAL") {
  mensagem("Configure a chave pública do Supabase no código antes de usar o painel.");
  throw new Error("Chave pública não configurada.");
}

const supabase = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLIC_KEY
);

function escapar(valor) {
  return String(valor ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;",
    '"':"&quot;", "'":"&#39;"
  })[c]);
}

function dinheiro(valor) {
  return Number(valor).toLocaleString("pt-BR", {
    style:"currency", currency:"BRL"
  });
}

async function verificarAdmin() {
  const { data, error } = await supabase.auth.getSession();
  if (error) throw error;

  if (!data.session) {
    $("login").classList.remove("hidden");
    $("painel").classList.add("hidden");
    return false;
  }

  const { data: autorizado, error: erroAdmin } =
    await supabase.rpc("is_vila_admin");

  if (erroAdmin) {
    throw new Error("Erro ao verificar administrador: " + erroAdmin.message);
  }

  if (autorizado !== true) {
    await supabase.auth.signOut();
    $("login").classList.remove("hidden");
    $("painel").classList.add("hidden");
    throw new Error("Usuário sem autorização de administrador. Confira se o UID correto está cadastrado na tabela admins do Supabase.");
  }

  $("login").classList.add("hidden");
  $("painel").classList.remove("hidden");
  await carregarAnuncios();
  return true;
}

$("formLogin").addEventListener("submit", async e => {
  e.preventDefault();
  const botao = $("botaoLogin");
  botao.disabled = true;
  mensagem("Verificando acesso...");

  try {
    const { error } = await supabase.auth.signInWithPassword({
      email: $("email").value.trim(),
      password: $("senha").value
    });

    if (error) throw error;

    $("senha").value = "";
    await verificarAdmin();
    mensagem("Acesso autorizado. Painel carregado.");
  } catch (err) {
    mensagem("Não foi possível abrir o painel:\n" + (err.message || "Erro desconhecido."));
  } finally {
    botao.disabled = false;
  }
});

async function carregarAnuncios() {
  $("lista").textContent = "Carregando anúncios...";

  try {
    const { data, error } = await supabase
      .from("anuncios")
      .select("*")
      .order("criado_em", { ascending:false });

    if (error) throw error;

    if (!data || data.length === 0) {
      $("lista").textContent = "Nenhum anúncio cadastrado ainda.";
      return;
    }

    $("lista").innerHTML = data.map(a => `
      <article class="item">
        <h3>${escapar(a.titulo)}</h3>
        <p>${escapar(a.cv)} · ${dinheiro(a.preco)}</p>
        <p class="status">Status: ${escapar(a.status)} · ${a.publicado ? "Publicado" : "Oculto"}</p>
        <p class="small">${escapar(a.descricao)}</p>
        <button type="button" data-editar="${escapar(a.id)}">Editar</button>
        <button type="button" class="danger" data-excluir="${escapar(a.id)}">Excluir</button>
      </article>
    `).join("");

    $("lista").querySelectorAll("[data-editar]").forEach(btn => {
      btn.addEventListener("click", () => {
        const a = data.find(x => x.id === btn.dataset.editar);
        if (!a) return;

        $("id").value = a.id;
        $("titulo").value = a.titulo;
        $("cv").value = a.cv;
        $("descricao").value = a.descricao || "";
        $("preco").value = a.preco;
        $("vendedor").value = a.vendedor || "Vila Store";
        $("imagem_url").value = a.imagem_url || "";
        $("status").value = a.status;
        $("publicado").checked = a.publicado;
        $("tituloForm").textContent = "Editar anúncio";
        mensagem("Editando anúncio: " + a.titulo);
        window.scrollTo({top:0, behavior:"smooth"});
      });
    });

    $("lista").querySelectorAll("[data-excluir]").forEach(btn => {
      btn.addEventListener("click", async () => {
        if (!confirm("Tem certeza de que deseja excluir este anúncio?")) return;

        try {
          const { error } = await supabase
            .from("anuncios")
            .delete()
            .eq("id", btn.dataset.excluir);

          if (error) throw error;

          mensagem("Anúncio excluído.");
          await carregarAnuncios();
        } catch (err) {
          mensagem("Erro ao excluir: " + err.message);
        }
      });
    });
  } catch (err) {
    $("lista").textContent = "Erro ao carregar anúncios: " + err.message;
    mensagem("Erro ao carregar anúncios: " + err.message);
  }
}

$("formAnuncio").addEventListener("submit", async e => {
  e.preventDefault();
  const botao = $("botaoSalvar");
  botao.disabled = true;
  mensagem("Salvando anúncio...");

  const id = $("id").value;
  const anuncio = {
    titulo: $("titulo").value.trim(),
    cv: $("cv").value.trim(),
    descricao: $("descricao").value.trim(),
    preco: Number($("preco").value),
    vendedor: $("vendedor").value.trim(),
    imagem_url: $("imagem_url").value.trim() || null,
    status: $("status").value,
    publicado: $("publicado").checked,
    atualizado_em: new Date().toISOString()
  };

  try {
    const resultado = id
      ? await supabase.from("anuncios").update(anuncio).eq("id", id)
      : await supabase.from("anuncios").insert(anuncio);

    if (resultado.error) throw resultado.error;

    mensagem(id ? "Anúncio atualizado!" : "Anúncio cadastrado!");
    limparFormulario();
    await carregarAnuncios();
  } catch (err) {
    mensagem("Erro ao salvar anúncio: " + err.message);
  } finally {
    botao.disabled = false;
  }
});

function limparFormulario() {
  $("formAnuncio").reset();
  $("id").value = "";
  $("vendedor").value = "Vila Store";
  $("tituloForm").textContent = "Cadastrar anúncio";
}

$("cancelar").addEventListener("click", () => {
  limparFormulario();
  mensagem("Formulário limpo.");
});

$("atualizar").addEventListener("click", carregarAnuncios);

$("sair").addEventListener("click", async () => {
  try {
    const { error } = await supabase.auth.signOut();
    if (error) throw error;

    $("painel").classList.add("hidden");
    $("login").classList.remove("hidden");
    mensagem("Você saiu do painel.");
  } catch (err) {
    mensagem("Erro ao sair: " + err.message);
  }
});

verificarAdmin().catch(err => {
  mensagem("Acesso não confirmado:\n" + err.message);
});
</script>
</body>
</html>
